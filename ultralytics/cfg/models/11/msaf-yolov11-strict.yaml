# MSAF-YOLO model based on YOLOv11 with P3/8 - P5/32 outputs.
# This YAML is designed to coexist with ELA-YOLO and EL-YOLOv8 in the same codebase.

nc: 80
scale: 'm'
scales:
  # n: [0.50, 0.25, 1024]
  # s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  # l: [1.00, 1.00, 512]
  # x: [1.00, 1.50, 512]

# MSAF-YOLO backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, SPDConv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, SPDConv, [128, 3, 2]]      # 1-P2/4
  - [-1, 2, C3k2_EMSC, [256, False, 0.25]]
  - [-1, 1, SPDConv, [256, 3, 2]]      # 3-P3/8
  - [-1, 2, C3k2_EMSC, [512, False, 0.25]]
  - [-1, 1, SPDConv, [512, 3, 2]]      # 5-P4/16
  - [-1, 2, C3k2_EMSC, [512, True]]
  - [-1, 1, SPDConv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 2, C3k2_EMSC, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 1, CAFM, [1024]]              # 10, replace C2PSA with CAFM

# MSAF-YOLO neck and head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]          # 12, cat backbone P4
  - [-1, 2, C3k2, [512, False]]        # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]          # 15, cat backbone P3
  - [-1, 2, C3k2_TripletAttention, [256, False]] # 16 (P3/8-small)

  - [-1, 1, SPDConv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]         # 18, cat head P4
  - [-1, 2, C3k2_TripletAttention, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, SPDConv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]         # 21, cat head P5
  - [-1, 2, C3k2_TripletAttention, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]    # 23 Detect(P3, P4, P5)
