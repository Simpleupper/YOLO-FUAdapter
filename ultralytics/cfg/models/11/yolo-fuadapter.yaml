# YOLO-Master-S + Uncertainty PPR/NCM + Attention + FUA Adapter
# PPRNCMBlock -> LightweightFBAttention -> Frequency-aware Uncertainty Adapter
# is inserted on the P3/P4/P5 features before Detect.

# Parameters
nc: 80 # number of classes; overridden by the dataset configuration during training
scales: # model compound scaling constants
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# YOLO-Master backbone with Mixture of Experts (MoE) layers
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, ES_MOE, [256]] # 3
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, ES_MOE, [512]] # 6-P3
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 8
  - [-1, 1, ES_MOE, [512]] # 9-P4
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 11
  - [-1, 1, ES_MOE, [1024]] # 12-P5

# YOLO11 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 9], 1, Concat, [1]] # 14 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 6], 1, Concat, [1]] # 17 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 18 P3/8-small

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20 cat head P4
  - [-1, 2, C3k2, [512, True]] # 21 P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23 cat head P5
  - [-1, 2, C3k2, [512, True]] # 24 P5/32-large

  # PPR/NCM + lightweight foreground-background attention + FUA Adapter.
  # Under s scale [0.50, 0.50, 1024], P3/P4/P5 channels are 128/256/256.
  # PPRNCMBlock args:
  # [channels, num_classes, tau_fg, tau_bg, temperature, gamma_fg, gamma_bg,
  #  delta_fg, delta_bg, eta, Tu, sep_margin, inter_margin, lambda_inter]
  - [18, 1, PPRNCMBlock, [128, nc, 0.20, 0.20, 0.10, 0.10, 0.10, 0.10, 0.10, 0.20, 0.10, 0.0, 0.5, 0.0]] # 25 PPRNCM-P3
  - [-1, 1, LightweightFBAttention, [128, 16, 7, 0.1]] # 26 FB-Attn-P3
  - [-1, 1, Adapter, [128, 0.25, 0.1, 3, True, 3]] # 27 FUA-Adapter-P3

  - [21, 1, PPRNCMBlock, [256, nc, 0.20, 0.20, 0.10, 0.10, 0.10, 0.10, 0.10, 0.20, 0.10, 0.0, 0.5, 0.0]] # 28 PPRNCM-P4
  - [-1, 1, LightweightFBAttention, [256, 16, 7, 0.1]] # 29 FB-Attn-P4
  - [-1, 1, Adapter, [256, 0.25, 0.1, 3, True, 3]] # 30 FUA-Adapter-P4

  - [24, 1, PPRNCMBlock, [256, nc, 0.20, 0.20, 0.10, 0.10, 0.10, 0.10, 0.10, 0.20, 0.10, 0.0, 0.5, 0.0]] # 31 PPRNCM-P5
  - [-1, 1, LightweightFBAttention, [256, 16, 7, 0.1]] # 32 FB-Attn-P5
  - [-1, 1, Adapter, [256, 0.25, 0.1, 3, True, 3]] # 33 FUA-Adapter-P5

  - [[27, 30, 33], 1, Detect, [nc]] # 34 Detect(P3, P4, P5)
