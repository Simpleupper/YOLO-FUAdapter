# Strict ELA-YOLO configuration adapted from uploaded YOLOE-v8 YAML.
# Main changes based on the ELA-YOLO paper:
# 1) C2f -> C2f_ELA: linear-attention representation block.
# 2) nn.Upsample + Concat -> DySample + SelectiveFusion: selective FPN neck with CBAM gating.
# 3) Detection layer changed to ELADetect to reproduce the lightweight detection head in ELA-YOLO.

nc: 80
scales:
  # n: [0.33, 0.25, 1024]
  # s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  # l: [1.00, 1.00, 512]
  # x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f_ELA, [128, True]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f_ELA, [256, True]]   # 4, P3 feature
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f_ELA, [512, True]]   # 6, P4 feature
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 3, C2f_ELA, [1024, True]]  # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9, P5 feature

head:
  # top-down path: P5 -> P4
  - [-1, 1, DySample, [1024, 2, "lp"]]             # 10: 20x20 -> 40x40
  - [[-1, 6], 1, SelectiveFusion, [1024, 512, 512]]       # 11: selective P4 fusion
  - [-1, 3, C2f_ELA, [512, False]]                       # 12: P4/16

  # top-down path: P4 -> P3
  - [-1, 1, DySample, [512, 2, "lp"]]              # 13: 40x40 -> 80x80
  - [[-1, 4], 1, SelectiveFusion, [512, 256, 256]]        # 14: selective P3 fusion
  - [-1, 3, C2f_ELA, [256, False]]                       # 15: P3/8-small

  # bottom-up path: P3 -> P4
  - [15, 1, Conv, [256, 3, 2]]                           # 16: 80x80 -> 40x40
  - [[-1, 12], 1, SelectiveFusion, [256, 512, 512]]       # 17
  - [-1, 3, C2f_ELA, [512, False]]                       # 18: P4/16-medium

  # bottom-up path: P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                           # 19: 40x40 -> 20x20
  - [[-1, 9], 1, SelectiveFusion, [512, 1024, 1024]]      # 20
  - [-1, 3, C2f_ELA, [1024, False]]                      # 21: P5/32-large

  - [[15, 18, 21], 1, ELADetect, [nc]]       # 22 lightweight ELADetect(P3, P4, P5)
