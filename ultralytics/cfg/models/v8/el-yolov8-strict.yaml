# EL-YOLOv8 configuration reproduced from:
# "EL-YOLOv8: a lightweight algorithm for efficient detection of pipeline welding defects in X-ray images"
#
# Main changes:
# 1) Backbone: C2f -> C2f_Faster_EMA
# 2) Neck: Slim-neck with GSConv + VoVGSCSP
# 3) Head: ELDynamicDetect dynamic-head-compatible detection layer

nc: 80
scale: m
scales:
  # n: [0.33, 0.25, 1024]
  # s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  # l: [1.00, 1.00, 512]
  # x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1-P2/4
  - [-1, 3, C2f_Faster_EMA, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]                # 3-P3/8
  - [-1, 6, C2f_Faster_EMA, [256, True]]      # 4-P3
  - [-1, 1, Conv, [512, 3, 2]]                # 5-P4/16
  - [-1, 6, C2f_Faster_EMA, [512, True]]      # 6-P4
  - [-1, 1, Conv, [1024, 3, 2]]               # 7-P5/32
  - [-1, 3, C2f_Faster_EMA, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]                  # 9-P5

head:
  # Slim-neck top-down pathway
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]]                  # 11 cat P4
  - [-1, 3, VoVGSCSP, [512]]                   # 12-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]]                  # 14 cat P3
  - [-1, 3, VoVGSCSP, [256]]                   # 15-P3/8 small

  # Slim-neck bottom-up PAN pathway
  - [15, 1, GSConv, [256, 3, 2]]               # 16 downsample
  - [[-1, 12], 1, Concat, [1]]                 # 17 cat P4
  - [-1, 3, VoVGSCSP, [512]]                   # 18-P4/16 medium

  - [-1, 1, GSConv, [512, 3, 2]]               # 19 downsample
  - [[-1, 9], 1, Concat, [1]]                  # 20 cat P5
  - [-1, 3, VoVGSCSP, [1024]]                  # 21-P5/32 large

  - [[15, 18, 21], 1, ELDynamicDetect, [nc]]   # Dynamic Detect(P3, P4, P5)
