# YoloTransformer-TransDetect, YOLO-compatible implementation

nc: 80
scale: s
scales:
  # n: [0.33, 0.25, 1024]
  # s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  # l: [1.00, 1.00, 512]
  # x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, CatConv, [128, 3, 2]]
  - [-1, 2, WELAN, [128]]
  - [-1, 1, CatConv, [256, 3, 2]]
  - [-1, 3, WELAN, [256]]
  - [-1, 1, CatConv, [512, 3, 2]]
  - [-1, 3, CNNSwinTransformer, [512, 4, 7]]
  - [-1, 1, CatConv, [1024, 3, 2]]
  - [-1, 2, WELAN, [1024]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, MsCS, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, WELAN, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, WELAN, [256]]
  - [16, 1, CatConv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 1, MsCS, [512]]
  - [-1, 1, CatConv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, MsCS, [1024]]
  - [[16, 19, 22], 1, Detect, [nc]]
