# Context and Scale-aware YOLO for welding defect detection
# Core ideas: context-aware image adjustment (PPNet + DIP), C3TR contextual block,
# and unified scale-aware P2-P6 feature detection approximating the paper's Gs/Gl twin paths.

nc: 80
scale: s
scales:
  # n: [0.33, 0.25, 1024]
  # s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 1024]
  # l: [1.00, 1.00, 1024]
  # x: [1.33, 1.25, 1024]

backbone:
  - [-1, 1, ContextAwareDIP, []]          # 0 context-aware differentiable image adjustment
  - [-1, 1, Conv, [64, 6, 2, 2]]          # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 2-P2/4
  - [-1, 3, C3, [128]]                    # 3 P2
  - [-1, 1, Conv, [256, 3, 2]]            # 4-P3/8
  - [-1, 6, C3, [256]]                    # 5 P3
  - [-1, 1, Conv, [512, 3, 2]]            # 6-P4/16
  - [-1, 9, C3, [512]]                    # 7 P4
  - [-1, 1, Conv, [1024, 3, 2]]           # 8-P5/32
  - [-1, 3, C3TR, [1024]]                 # 9 contextual transformer block before SPPF
  - [-1, 1, SPPF, [1024, 5]]              # 10 P5
  - [-1, 1, Conv, [1024, 3, 2]]           # 11-P6/64 for large-defect path
  - [-1, 3, C3, [1024]]                   # 12 P6

head:
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C3, [1024, False]]            # 16 P5 fused

  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C3, [512, False]]             # 20 P4 fused

  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C3, [256, False]]             # 24 P3 fused

  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C3, [128, False]]             # 28 P2/small output

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 24], 1, Concat, [1]]
  - [-1, 3, C3, [256, False]]             # 31 P3 output

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 20], 1, Concat, [1]]
  - [-1, 3, C3, [512, False]]             # 34 P4 output

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 3, C3, [1024, False]]            # 37 P5 output

  - [-1, 1, Conv, [1024, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C3, [1024, False]]            # 40 P6/large output

  - [[28, 31, 34, 37, 40], 1, CSAScaleAwareDetect, [nc]]
